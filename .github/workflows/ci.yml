name: Bmad Ecosystem - Build & Test

on:
  # Run on demand
  workflow_dispatch:

  # Run on pushes to branches
  push:

  # Run on pull requests
  pull_request:

  ## Future Ideas:
  ## PR make it 10 or less
  ## For main and time based we can run something bigger

  ## Run when releases are published
  ## release:
  ##   types:
  ##     - "published"

# Configuration for the version of external packages
# We do this so we can cache them and avoid checking out that big
# repository at all times.

env:
  EXTERNAL_PACKAGES_VERSION: main

#
jobs:
  build:
    runs-on: ${{ matrix.os }}
    #
    defaults:
      run:
        shell: bash

    strategy:
      matrix:
        # Future Ideas:
        # add macOS - check if GH Actions can make intel and arm
        os: [ubuntu-latest]
        shared: ["Y"]
        openmp_mpi: ["N", "Y"]

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-dependencies
        with:
          external-packages-version: ${{ env.EXTERNAL_PACKAGES_VERSION }}

      - name: Build Bmad
        env:
          USE_MPI: ${{ matrix.openmp_mpi }}
          SHARED: ${{ matrix.shared }}
        run: .github/scripts/install_bmad.sh

      - name: Run Tests
        run: .github/scripts/run_tests.sh

      - name: Assemble Tarball
        run: |
          mkdir -p ~/bmad_dist
          cp -r $GITHUB_WORKSPACE/*  ~/bmad_dist
          tar --exclude .git --exclude .github --exclude .gitignore -czf bmad_dist.tar.gz -C ~/bmad_dist .

      - uses: actions/upload-artifact@v4
        with:
          name: bmad-built-${{ matrix.os }}-${{ matrix.shared }}-${{ matrix.openmp_mpi }}-${{ github.sha }}
          path: bmad_dist.tar.gz
